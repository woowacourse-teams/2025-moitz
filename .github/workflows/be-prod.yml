name: 무중단 배포 테스트

on:
  push:
    branches:
      - be-prod
  workflow_dispatch:

jobs:
  deploy_prod:
    runs-on: [self-hosted, lb]

    steps:
      - name: 1단계 Green 인스턴스 부팅
        run: |
          echo "➡️ Green 인스턴스 부팅"
          GREEN_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters 'Name=tag:ProjectTeam,Values=moitz' \
                      'Name=tag:Color,Values=green' \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "::add-mask::$GREEN_INSTANCE_ID"

          if [ -z "$GREEN_INSTANCE_ID" ] || [ "$GREEN_INSTANCE_ID" == "None" ]; then
            echo "🔴 Green 인스턴스를 찾을 수 없습니다"
            exit 1
          fi

          echo GREEN_INSTANCE_ID=$GREEN_INSTANCE_ID >> $GITHUB_ENV
          aws ec2 start-instances --instance-ids $GREEN_INSTANCE_ID
          aws ec2 wait instance-status-ok --instance-ids $GREEN_INSTANCE_ID
          echo "✅ Green 인스턴스 부팅 완료"

      - name: 2단계 Blue/Green IP 가져오기 및 deploy.sh 실행 + 내부 헬스체크
        run: |
          echo "➡️ Blue/Green 인스턴스 정보 조회"

          BLUE_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters 'Name=tag:ProjectTeam,Values=moitz' \
                      'Name=tag:Color,Values=blue' \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          BLUE_INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids $BLUE_INSTANCE_ID \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          GREEN_INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.GREEN_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          if [ -z "$BLUE_INSTANCE_ID" ] || [ "$BLUE_INSTANCE_ID" == "None" ]; then
            echo "🔴 Blue 인스턴스를 찾을 수 없습니다"
            exit 1
          fi

          echo "::add-mask::$BLUE_INSTANCE_ID"
          echo "::add-mask::$BLUE_INSTANCE_IP"
          echo "::add-mask::$GREEN_INSTANCE_IP"
          echo BLUE_INSTANCE_ID=$BLUE_INSTANCE_ID >> $GITHUB_ENV
          echo BLUE_INSTANCE_IP=$BLUE_INSTANCE_IP >> $GITHUB_ENV
          echo GREEN_INSTANCE_IP=$GREEN_INSTANCE_IP >> $GITHUB_ENV

          echo "➡️ Green 인스턴스에서 deploy.sh 실행 (Polling 방식)"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ env.GREEN_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Run deploy.sh on Green EC2" \
            --parameters 'commands=["sudo /var/snap/amazon-ssm-agent/11798/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "✅ deploy.sh 실행 감시 중..."

          MAX_ATTEMPTS=120
          SLEEP_SEC=10
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ env.GREEN_INSTANCE_ID }} \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "[$i/$MAX_ATTEMPTS] 현재 상태: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then
              echo "✅ deploy.sh 실행 성공"
              break
            elif [[ "$STATUS" == "Failed" ]]; then
              echo "🔴 deploy.sh 실패 로그 출력"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ env.GREEN_INSTANCE_ID }} \
                --query "{stdout:StandardOutputContent, stderr:StandardErrorContent}" \
                --output text
              exit 1
            fi
            sleep $SLEEP_SEC
          done

          echo "➡️ Private IP 기반 헬스체크 수행"
          HEALTH_RESULT=$(curl -fsS "http://${GREEN_INSTANCE_IP}:80/health" || echo "curl_failed")

          if echo "$HEALTH_RESULT" | jq -e '.status == "UP"' >/dev/null 2>&1; then
              echo "✅ Green 헬스체크 성공: $HEALTH_RESULT"
          else
              echo "🔴 Green 헬스체크 실패: $HEALTH_RESULT"
              echo "⚠️ Blue로 즉시 롤백 수행"
              sudo sed -i "s/${{ env.GREEN_INSTANCE_IP }}/${{ env.BLUE_INSTANCE_IP }}/g" /etc/nginx/sites-available/default
              sudo nginx -t && sudo nginx -s reload
              exit 1
          fi

      - name: 3단계 Green으로 프록시 전환 및 Blue 정지
        run: |
          echo "➡️ Nginx 프록시 Green으로 변경"
          sudo sed -i "s/${{ env.BLUE_INSTANCE_IP }}/${{ env.GREEN_INSTANCE_IP }}/g" /etc/nginx/sites-available/default
          sudo nginx -t && sudo nginx -s reload
          sleep 5
          echo "✅ Nginx 프록시 변경 완료"

          echo "➡️ Blue 인스턴스 임시정지"
          aws ec2 stop-instances --instance-ids ${{ env.BLUE_INSTANCE_ID }}
          aws ec2 wait instance-stopped --instance-ids ${{ env.BLUE_INSTANCE_ID }}
          echo "✅ Blue 인스턴스 임시정지 완료"

          echo "➡️ Green/Blue 태그 교체"
          aws ec2 create-tags --resources ${{ env.GREEN_INSTANCE_ID }} --tags Key=Color,Value=blue
          aws ec2 create-tags --resources ${{ env.BLUE_INSTANCE_ID }} --tags Key=Color,Value=green
          echo "✅ 태그 교체 완료!"
